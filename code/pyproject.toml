[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black + a 3 characters margin.
line-length = 123

# Assume Python 3.10
target-version = "py311"

[lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "tests"
]
addopts = "-x --cov-report term --cov-report xml:coverage.xml --cov-config=../.coveragerc --junitxml=pytest-junit.xml"

# Settings for federated learning
[project]
name = "federated-stress"
version = "1.0.0"
description = "Federated Learning for Stress Detection"
license = "Apache-2.0"

[tool.flwr.app]
publisher = "bfh"

[tool.flwr.app.components]
serverapp = "src.learning_methods.federated.xgboost_server:app"
clientapp = "src.learning_methods.federated.xgboost_.client:app"

[tool.flwr.app.config]
# ServerApp
num-server-rounds = 3
fraction-fit = 0.1
fraction-evaluate = 0.1

# ClientApp
local-epochs = 1
params.objective = "binary:logistic"
params.eta = 0.1 # Learning rate
params.max-depth = 8
params.eval-metric = "auc"
params.nthread = 16
params.num-parallel-tree = 1
params.subsample = 1
params.tree-method = "hist"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 34