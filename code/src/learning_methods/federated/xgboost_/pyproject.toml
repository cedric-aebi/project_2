# Settings for federated learning
[project]
name = "federated-stress"
version = "1.0.0"
description = "Federated Learning for Stress Detection"
license = "Apache-2.0"

[tool.flwr.app]
publisher = "bfh"

[tool.flwr.app.components]
serverapp = "server:app"
clientapp = "client:app"

[tool.flwr.app.config]
# ServerApp
num-server-rounds = 50
fraction-fit = 0.1
fraction-evaluate = 0.1

# ClientApp
local-epochs = 1
params.objective = "binary:logistic"
params.eta = 0.1 # Learning rate
params.max-depth = 8
params.n-estimators = 300
params.eval-metric = "auc"
params.nthread = 16
params.num-parallel-tree = 1
params.subsample = 1
params.tree-method = "hist"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 34
