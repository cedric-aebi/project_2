# Settings for federated learning
[project]
name = "federated-stress"
version = "1.0.0"
description = "Federated Learning for Stress Detection"
license = "Apache-2.0"

[tool.flwr.app]
publisher = "bfh"

[tool.flwr.app.components]
serverapp = "server:app"
clientapp = "client:app"

[tool.flwr.app.config]
# ServerApp
train-method = "bagging" # Choose from [bagging, cyclic]
num-server-rounds = 34
fraction-fit = 1.0
fraction-evaluate = 1.0
centralised-eval = true

# ClientApp
partitioner-type = "uniform" # Choose from [uniform, linear, square, exponential]
test-fraction = 0.2
seed = 42
centralised-eval-client = true
local-epochs = 1
scaled-lr = true
params.objective = "binary:logistic"
params.eta = 0.1 # Learning rate
params.max-depth = 12
params.n_estimators = 400
params.nthread = 16
params.num-parallel-tree = 1
params.subsample = 0.8
params.tree-method = "hist"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 34
